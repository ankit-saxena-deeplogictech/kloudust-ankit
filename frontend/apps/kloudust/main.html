<style>
@import url('./css/tokens.css');
@import url('./css/shell.css');
@import url('./css/components.css');
</style>

<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="./img/favicon.png" rel="icon" type="image/x-icon">

	<script type="module">
	import {main} from "./js/main.mjs"; window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main = main;
	import {loginmanager} from "./js/loginmanager.mjs"; window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].loginmanager = loginmanager;
	if (localStorage.getItem("kd-theme") === "dark") document.documentElement.dataset.theme = "dark";
	if (localStorage.getItem("kd-nav") === "collapsed") document.querySelector(".app")?.classList.add("nav-collapsed");
	main.registerHostingDivAndInitialContentTemplate(document.querySelector("div#maincontent"),
		document.querySelector("template#initialContent"), "close", 400);
	main.showContent();
	</script>

	<title>{{i18n.Title}}</title>
</head>

<body>
<div class="app" id="app">

<aside class="sidebar">
	<div class="sb-brand"><span class="logo">K</span><span>Kloudust</span></div>

	<nav class="sb-nav" aria-label="Primary">
		<div class="sb-group" id="topleftbaritems">
			{{#mainPageData.leftbarCommands}}
			<a class="sb-item leftbaritem" id="leftbarcmd_{{id}}"
					onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.cmdClicked(this, '{{id}}')">
				<img src="{{{logo}}}" alt=""><span>{{label}}</span>
			</a>
			{{/mainPageData.leftbarCommands}}
		</div>
	</nav>

	<div class="sb-foot">
		<span class="sb-version">Kloudust Console</span>
		<button class="sb-collapse" aria-label="Collapse sidebar"
			onclick="const app=document.getElementById('app'); app.classList.toggle('nav-collapsed'); localStorage.setItem('kd-nav', app.classList.contains('nav-collapsed')?'collapsed':'open');">
			<svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
		</button>
	</div>
</aside>
<div class="scrim" onclick="document.getElementById('app').classList.remove('nav-open')"></div>

<div class="main">
<header class="topbar">
	<button class="tb-iconbtn tb-hamburger" aria-label="Open navigation"
		onclick="document.getElementById('app').classList.toggle('nav-open')">
		<svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
	</button>

	<div class="tb-project">
		<label for="projects">{{i18n.ActiveProject}}</label>
		<select id="projects" onchange="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.activeProjectChanged(this.value)">
			{{#mainPageData.userprojects}}<option class="projects" name="{{{name}}}" value="{{{name}}}" {{#selected}}selected{{/selected}}>{{name}}</option>{{/mainPageData.userprojects}}
		</select>
	</div>

	<div class="tb-spacer"></div>

	<button class="tb-iconbtn" aria-label="Toggle dark mode" title="Toggle dark mode"
		onclick="const h=document.documentElement; const dark=h.dataset.theme==='dark'; if (dark) delete h.dataset.theme; else h.dataset.theme='dark'; localStorage.setItem('kd-theme', dark?'light':'dark');">
		<svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9"/></svg>
	</button>

	<button class="tb-iconbtn" aria-label="Logout" title="Logout"
		onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].loginmanager.logout()">
		<svg class="icon" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M7 6a8 8 0 1 0 10 0"/></svg>
	</button>
</header>

<div id="maincontent" class="content">
	<!-- Whatever is open goes here -->
</div>
</div>

</div>

<template id="initialContent">
<div id="welcomediv">
	<img id="mainlogo" src="img/kloudustlogo.svg">
	<span id="welcome">{{mainPageData.welcomeHeading}}</span>
	<span id="welcome_subheading">{{i18n.WelcomeSubheading}}</span>
</div>

<div id="buttons">
	{{#mainPageData.mainCommands}}
	<div class="quickaction" onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.cmdClicked(this, '{{id}}')">
		<img src="{{{logo}}}" alt=""><span>{{label}}</span>
	</div>
	{{/mainPageData.mainCommands}}
</div>
</template>

</body>
</html>
