Redesigned shell — tokens/shell/components stylesheets drive all styling.
Sidebar groups come from main_leftbar.json's "groups" declaration; the topbar
carries the command palette (⌘K), project switcher, alerts, theme, help and
the user menu, per the redesign wireframes.
-->
<style>
@import url('./css/tokens.css');
@import url('./css/shell.css');
@import url('./css/components.css');
</style>

<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="./img/favicon.png" rel="icon" type="image/x-icon">

	<script type="module">
	import {main} from "./js/main.mjs"; window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main = main;
	import {loginmanager} from "./js/loginmanager.mjs"; window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].loginmanager = loginmanager;
	if (localStorage.getItem("kd-theme") === "dark") document.documentElement.dataset.theme = "dark";
	if (localStorage.getItem("kd-nav") === "collapsed") document.querySelector(".app")?.classList.add("nav-collapsed");
	main.registerHostingDivAndInitialContentTemplate(document.querySelector("div#maincontent"),
		document.querySelector("template#initialContent"), "close", 400);
	main.showContent();
	main.initShell();
	</script>

	<title>{{i18n.Title}}</title>
</head>

<body>
<div class="app" id="app">

<aside class="sidebar">
	<div class="sb-brand"><span class="logo">K</span><span>Kloudust</span></div>

	<nav class="sb-nav" aria-label="Primary">
		{{#mainPageData.leftbarGroups}}
		<div class="sb-group{{#danger}} danger{{/danger}}">
			{{#label}}<div class="sb-group-label">{{.}}</div>{{/label}}
			{{#items}}
			<a class="sb-item leftbaritem" id="leftbarcmd_{{id}}"
					onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.cmdClicked(this, '{{id}}')">
				<img src="{{{logo}}}" alt=""><span>{{label}}</span>
			</a>
			{{/items}}
		</div>
		{{/mainPageData.leftbarGroups}}
	</nav>

	<div class="sb-foot">
		<span class="sb-version">Kloudust Console</span>
		<button class="sb-collapse" aria-label="Collapse sidebar"
			onclick="const app=document.getElementById('app'); app.classList.toggle('nav-collapsed'); localStorage.setItem('kd-nav', app.classList.contains('nav-collapsed')?'collapsed':'open');">
			<svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
		</button>
	</div>
</aside>
<div class="scrim" onclick="document.getElementById('app').classList.remove('nav-open')"></div>

<div class="main">
<header class="topbar">
	<button class="tb-iconbtn tb-hamburger" aria-label="Open navigation"
		onclick="document.getElementById('app').classList.toggle('nav-open')">
		<svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
	</button>

	<button class="tb-search" onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.togglePalette(true)">
		<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
		{{i18n.SearchCommands}}
		<kbd>⌘K</kbd>
	</button>

	<div class="tb-spacer"></div>

	<div class="tb-project">
		<label for="projects">{{i18n.ActiveProject}}</label>
		<select id="projects" onchange="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.activeProjectChanged(this.value)">
			{{#mainPageData.userprojects}}<option class="projects" name="{{{name}}}" value="{{{name}}}" {{#selected}}selected{{/selected}}>{{name}}</option>{{/mainPageData.userprojects}}
		</select>
	</div>

	<button class="tb-iconbtn" aria-label="Alerts" title="Alerts"
		onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.cmdClicked(this, 'alerts')">
		<svg class="icon" viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
		{{#mainPageData.alertcount}}<span class="badge-dot">{{.}}</span>{{/mainPageData.alertcount}}
	</button>

	<button class="tb-iconbtn" aria-label="Toggle dark mode" title="Toggle dark mode"
		onclick="const h=document.documentElement; const dark=h.dataset.theme==='dark'; if (dark) delete h.dataset.theme; else h.dataset.theme='dark'; localStorage.setItem('kd-theme', dark?'light':'dark');">
		<svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9"/></svg>
	</button>

	<button class="tb-iconbtn" aria-label="{{i18n.Help}}" title="{{i18n.Help}}"
		onclick="window.open(APP_CONSTANTS.APP_ABOUT_URL||'https://tekmonks.com', '_blank')">
		<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.7 2.2c-.8.5-1.2 1-1.2 1.8v.5M12 17v.01"/></svg>
	</button>

	<div class="menu-wrap">
		<button class="tb-user" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"
			onclick="event.stopPropagation(); window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.toggleMenu(this)">
			<span class="avatar">{{mainPageData.userInitials}}</span>
			<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
		</button>
		<div class="menu" role="menu">
			<div class="menu-label">{{mainPageData.username}}</div>
			<hr>
			<button onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].loginmanager.logout()">
				<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M7 6a8 8 0 1 0 10 0"/></svg>
				{{i18n.Logout}}
			</button>
		</div>
	</div>
</header>

<div id="maincontent" class="content">
	<!-- Whatever is open goes here -->
</div>
</div>

</div>

<!-- Command palette (⌘K) -->
<div class="overlay" id="palette_overlay" role="dialog" aria-modal="true" aria-label="{{i18n.SearchCommands}}"
	onclick="if (event.target === this) window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.togglePalette(false)">
	<div class="modal palette">
		<input type="text" placeholder="{{i18n.SearchCommands}}" aria-label="{{i18n.SearchCommands}}"
			oninput="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.paletteFilter(this.value)"
			onkeydown="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.paletteKeydown(event)">
		<ul id="palette_list">
			{{#mainPageData.paletteCommands}}
			<li><button onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.paletteRun('{{id}}')">
				<img src="{{{logo}}}" alt=""><span>{{label}}</span>
			</button></li>
			{{/mainPageData.paletteCommands}}
		</ul>
	</div>
</div>

<template id="initialContent">
<div id="welcomediv">
	<img id="mainlogo" src="img/kloudustlogo.svg">
	<span id="welcome">{{mainPageData.welcomeHeading}}</span>
	<span id="welcome_subheading">{{i18n.WelcomeSubheading}}</span>
</div>

<div id="buttons">
	{{#mainPageData.mainCommands}}
	<div class="quickaction" onclick="window.monkshu_env.apps[APP_CONSTANTS.APP_NAME].main.cmdClicked(this, '{{id}}')">
		<img src="{{{logo}}}" alt=""><span>{{label}}</span>
	</div>
	{{/mainPageData.mainCommands}}
</div>
</template>

</body>
</html>
