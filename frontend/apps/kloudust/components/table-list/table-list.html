<!--
/**
 * Table list HTML — Kloudust redesign skin.
 *
 * Styling contract:
 *  - Design tokens inherit from the document (css/tokens.css) through the
 *    shadow boundary; shared classes come from css/components.css.
 *  - The {{style}} tabledef passthrough renders AFTER the base styles so
 *    legacy form.json overrides (e.g. div#tablebottombar{display:none}) keep
 *    winning. Deprecated — replaced by declarative keys in a later phase.
 *
 * Backward compatibility notes (do not break):
 *  - Ids div#onclick_html, div#hider are queried by table-list.mjs; ids
 *    div#tablebody, div#tablemain, div#tableclose, div#tablebottombar are
 *    targeted by legacy style strings inside form.jsons.
 *  - The enable_copy blocks and row onclick handlers are behavior — copied
 *    verbatim from the original template.
 *
 * (C) 2023 TekMonks. All rights reserved.
 * License: See enclosed license file.
 */
 -->

<style>
@import url('./css/components.css');

:host {
    display: block;
    height: 100%;
    overflow-y: auto;
}

div#tablebody {
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100%;
    box-sizing: border-box;
}

div#tabletop {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-3);
    margin-bottom: var(--sp-4);
    min-height: 32px;
}

div#tablemain {
    width: 100%;
}

/* --- Row-click popup (legacy iconlist actions) ---------------------------- */
div#hider {
    color: transparent;
    background-color: transparent;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
}
div#hider.visible { z-index: 99; display: block; }

div#onclick_html {
    position: absolute;
    z-index: 100;
    color: var(--text);
    background-color: var(--surface);
    width: calc(100% - var(--sidebar-w) - 48px);
    display: none;
    border: 1px solid var(--border);
    padding: var(--sp-4);
    box-sizing: border-box;
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
}
div#onclick_html.visible {
    display: block;
    left: calc(var(--sidebar-w) + 24px);
    margin-right: 24px;
}

div#tablebottombar {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-end;
    gap: var(--sp-2);
    width: 100%;
    padding: var(--sp-3) 0;
}
div#tablebottombar:empty { display: none; }

/* --- Shift+click copy affordance ------------------------------------------ */
{{#enable_copy}}tbody td {position: relative; cursor: copy;}{{/enable_copy}}

tbody.copy-enabled td:hover::after {
    content: '{{{i18n.ClickToCopy}}}';
    position: absolute;
    top: -1.8em;
    left: 0;
    background: var(--tooltip-bg);
    color: var(--tooltip-text);
    font-size: 0.75em;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
    box-shadow: var(--shadow-sm);
}

td[data-copied="true"]::after {
    content: '{{{i18n.Copied}}}';
    position: absolute;
    left: 0;
    top: -1.8em;
    background: var(--tooltip-bg);
    color: var(--tooltip-text);
    padding: 2px 6px;
    font-size: 0.75em;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 5;
    pointer-events: none;
    box-shadow: var(--shadow-sm);
}

.dt tbody tr { cursor: pointer; }
</style>
{{#style}}<style>{{{.}}}</style>{{/style}}

<div id="tablebody">

<div id="tabletop">
    <div>{{#formtitle}}<h1>{{.}}</h1>{{/formtitle}}</div>
    <div id="tableclose" class="iconbtn" role="button" tabindex="0" aria-label="Close"
        onclick='event.stopPropagation(); monkshu_env.components["form-runner"].close(this)'>
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </div>
</div>

<div id="tablemain" class="card table-card">
<div class="table-scroll">
<table class="dt">
    <thead>
    <tr>
    {{#headers}}<th>{{.}}</th>{{/headers}}
    </tr>
    </thead>

    <tbody {{#enable_copy}} class="copy-enabled" onclick="
        if (!event.shiftKey) return;
        const el = (event.target && event.target.nodeType == Node.TEXT_NODE) ? event.target.parentElement : event.target;
        const td = (el && el.closest) ? el.closest('td') : undefined, tbody = (el && el.closest) ? el.closest('tbody') : undefined;
        const textToCopy = (td && tbody) ? (td.textContent||'').trim() : undefined;
        if (textToCopy) { $$.copyTextToClipboard(textToCopy); tbody.classList.remove('copy-enabled'); td.dataset.copied='true';
            clearTimeout(td.__t); td.__t = setTimeout(_=>{delete td.dataset.copied; tbody.classList.add('copy-enabled');}, 1200); }
    " {{/enable_copy}}>

    {{#rows}}
    <tr {{#enable_copy}}onclick="if (!event.shiftKey) {monkshu_env.components['table-list'].rowClicked(event, '{{{rowdata_json_base64}}}')}"{{/enable_copy}}
        {{^enable_copy}}onclick="monkshu_env.components['table-list'].rowClicked(event, '{{{rowdata_json_base64}}}')"{{/enable_copy}}>
    {{#.}}<td>{{.}}</td>{{/.}}
    </tr>
    {{/rows}}
    </tbody>
</table>
</div>
</div>

<div id="hider" onclick="monkshu_env.components['table-list'].hidePopup(event)"></div>
<div id="onclick_html"></div>

<div id="tablebottombar">{{{bottom_bar_html}}}</div>
</div>
