<style>
:host { display: block; margin-bottom: var(--sp-4); }

select, input {
    font: 400 var(--fs-sm) var(--font-sans);
    color: var(--text);
    background-color: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: var(--r-sm);
    padding: 6px 10px;
    min-height: 32px;
    min-width: 0;
    outline: none;
    transition: border-color var(--transition);
}
select:hover, input:hover { border-color: var(--n-400); }
select:focus, input:focus { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--primary-soft); }
input::placeholder { color: var(--text-3); }
select option { background-color: var(--surface); color: var(--text); }
input { flex: 1; }
select { flex: 1; cursor: pointer; }

span#vnetsrow {
    width: 100%;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--sp-2);
    margin-bottom: var(--sp-3);
}

span#buttonspan {
    display: flex;
    min-width: 4em;
    justify-content: space-between;
    gap: var(--sp-1);
    margin-left: var(--sp-1);
}
span.roundbutton {
    width: 24px;
    height: 24px;
    border: 1px solid var(--border-2);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--text-2);
    font-size: var(--fs-md);
    line-height: 1;
    cursor: pointer;
    user-select: none;
    background-color: var(--surface);
}
span.roundbutton:hover { border-color: var(--primary); color: var(--primary); }
</style>

<div id="vnetscontainer">
{{#vnets.vnet_ips}}
    <span id="vnetsrow">
        <select name="vnet" id="vnet">
            <option value="">Select a VNet</option>
            {{#vnets}}
              <option value="{{name}}" {{selected}}>{{name}}</option>
            {{/vnets}}
    </select>

    <input id="ip" type="text" placeholder="Gateway Address" value={{ip}}>

    <span id="buttonspan">
        <span class="roundbutton" onclick="monkshu_env.components['vnet-ip'].addRow(this.parentNode.parentNode)">+</span>
        <span class="roundbutton" onclick="monkshu_env.components['vnet-ip'].removeRow(this.parentNode.parentNode)">-</span>
    </span>
</span>
{{/vnets.vnet_ips}}
</div>

<template id="vnetsrowtemplate">
<span id="vnetsrow">
    <select name="vnet" id="vnet">
        <option value="">Select a VNet</option>
        {{#vnets.vnets}}
            <option value="{{.}}">{{.}}</option>
        {{/vnets.vnets}}
    </select>

    <input id="ip" type="text" placeholder="IP Address">

    <span id="buttonspan">
        <span class="roundbutton" onclick="monkshu_env.components['vnet-ip'].addRow(this.parentNode.parentNode)">+</span>
        <span class="roundbutton" onclick="monkshu_env.components['vnet-ip'].removeRow(this.parentNode.parentNode)">-</span>
    </span>
</span>
</template>
